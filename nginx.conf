server {
    listen 80;
    server_name _;

    # Frontend estático (index.html, app.js, style.css)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API: /api/* se proxea al servicio "api" en la red de compose.
    # La barra final en proxy_pass elimina el prefijo /api/ antes de reenviar:
    #   /api/services  ->  http://api:8080/services
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
